# Origina en: ADR-001 (stack backend). MySQL como motor relacional principal
# (instrucciones del proyecto, sección 8).
#
# TODO(equipo): reemplazar las credenciales de ejemplo antes de usar en
# cualquier entorno compartido (no son válidas para producción/CI).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: humworld
      MYSQL_ROOT_PASSWORD: changeme  # TODO(equipo): reemplazar
      MYSQL_USER: humworld
      MYSQL_PASSWORD: changeme  # TODO(equipo): reemplazar
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://humworld:changeme@db:3306/humworld  # TODO(equipo)
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

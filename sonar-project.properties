sonar.projectKey=Lin0u_Equipo3-Humworld
sonar.organization=lin0u

# Versión de Python de la imagen Docker y del CI (advertencia de análisis).
sonar.python.version=3.11

# Código de producción y código de pruebas por separado (advertencia de
# análisis: sin sonar.tests, las pruebas se analizaban y medían como código
# de producción y bajaban la cobertura).
sonar.sources=.
sonar.tests=src/tests,frontend/src
sonar.test.inclusions=src/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.exclusions=frontend/node_modules/**,frontend/coverage/**,frontend/dist/**,src/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

# Reportes de cobertura descargados por el job sonarqube (ci.yml).
sonar.python.coverage.reportPaths=src/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Fuera de la medición de cobertura, con la misma justificación que en
# src/.coveragerc y frontend/vite.config.js: migraciones (se verifican al
# aplicarse en el despliegue), configuración, arranque, datos de ejemplo de la
# maqueta, el scheduler y las vistas que dibujan con Leaflet o Chart.js
# (requieren un navegador real). Documentación y especificaciones no son código.
sonar.coverage.exclusions=alembic/**,docs/**,openspec/**,src/app/jobs/scheduler.py,frontend/*.config.js,frontend/src/main.jsx,frontend/src/datos/*Ejemplo.js,frontend/src/pantallas/MapaHumor.jsx,frontend/src/componentes/GraficoEvolucion.jsx

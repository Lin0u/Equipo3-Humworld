[pytest]
# Configuración de pytest para la suite del módulo Captura RSS (Sprint 1).
#
# asyncio_mode / loop_scope: fija explícitamente el ámbito del event loop de
# pytest-asyncio para eliminar el PytestDeprecationWarning que, de lo contrario,
# se emite en cada ejecución. No cambia el comportamiento de las pruebas (la
# suite actual es síncrona vía TestClient), solo silencia ruido en el reporte.
asyncio_default_fixture_loop_scope = function
testpaths = tests
